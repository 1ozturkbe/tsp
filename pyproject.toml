[project]
name = "tsp"
version = "0.1.0"
description = "TSP row generation and VRP column generation notebooks"
authors = [{ name = "1ozturkbe", email = "1ozturkbe@gmail.com" }]
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyomo (>=6.7,<7.0)",
    "highspy (>=1.7,<2.0)",
    "numpy (>=1.26,<3.0)",
    "matplotlib (>=3.8,<4.0)",
    "ipykernel (>=6.29,<7.0)",
    "jupyter (>=1.0,<2.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
